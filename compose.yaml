services:
  db:
    image: timescale/timescaledb:2.28.3-pg17
    environment:
      POSTGRES_DB: sensor_system
      POSTGRES_USER: sensor_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensor_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_app -d sensor_system"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      POSTGRES_DB: sensor_system
      POSTGRES_USER: sensor_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensor_dev_password}
      THRESHOLDS_FILE: /app/data/thresholds.json
      FLASK_DEBUG: "true"
      FLASK_ENV: "development"
      SOCKETIO_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000,http://127.0.0.1:5000"
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - ./data:/app/data
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    command:
      [
        "gunicorn",
        "--reload",
        "--worker-class",
        "gthread",
        "--workers",
        "1",
        "--threads",
        "20",
        "--bind",
        "0.0.0.0:5000",
        "run:app"
      ]
    init: true
    restart: unless-stopped

  browser-sync:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app:ro     # obserwuje pliki projektu
    ports:
      - "3000:3000"   # tutaj wchodzisz w przeglądarce
      - "3001:3001"   # opcjonalnie UI BrowserSync
    command:
    - sh
    - -c
    - >
      npm install -g browser-sync &&
      browser-sync start --config /app/browser-sync.js
    depends_on:
      - app
volumes:
  postgres_data:
