<div class="ai-chat-app" id="ai-chat">
  <header class="ai-chat-header">
    <span class="ai-chat-dot"></span>
    <div>
      <div class="ai-chat-title">AI AGENT</div>
    </div>
  </header>

  <div class="ai-chat-messages" id="ai-chat-messages"></div>

  <div class="ai-chat-hint">
    Wyślij: <kbd>Enter</kbd> • Nowa linia: <kbd>Shift</kbd> + <kbd>Enter</kbd>
  </div>

  <form class="ai-chat-composer" id="ai-chat-form">
    <textarea
      id="ai-chat-input"
      placeholder="Napisz wiadomość..."
      autocomplete="off"
    ></textarea>
    <button type="submit" id="ai-chat-send">Wyślij</button>
  </form>
</div>
