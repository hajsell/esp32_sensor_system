<section class="card__body" id="thresholds">
  <form class="thresholds-form" id="thresholds-form" autocomplete="off">
    <div class="threshols-header">
      <h2>THRESHOLDS</h2>
    </div>
    <div class="thresholds-grid">
      <label class="threshold-field">
        <span class="threshold-label">Temprature (°C)</span>
        <input class="threshold-input" type="number" step="0.1" inputmode="decimal" name="temp" placeholder="">
      </label>

      <label class="threshold-field">
        <span class="threshold-label">Humidity (%)</span>
        <input class="threshold-input" type="number" step="0.1" inputmode="decimal" name="humidity" placeholder="">
      </label>

      <label class="threshold-field">
        <span class="threshold-label">MQ2</span>
        <input class="threshold-input" type="number" step="1" inputmode="numeric" name="mq2" placeholder="">
      </label>

      <label class="threshold-field">
        <span class="threshold-label">MQ7</span>
        <input class="threshold-input" type="number" step="1" inputmode="numeric" name="mq7" placeholder="">
      </label>
    </div>

    <div class="thresholds-actions">
      <button class="thresholds-btn" type="button" id="thresholds-clear">Wyczyść</button>
      <button class="thresholds-btn primary" type="submit">Ustaw</button>
    </div>
  </form>
</section>
