services:
  db:
    image: timescale/timescaledb:2.28.3-pg17
    environment:
      POSTGRES_DB: sensor_system
      POSTGRES_USER: sensor_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sensor_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensor_app -d sensor_system"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://sensor_app:${POSTGRES_PASSWORD:-sensor_dev_password}@db:5432/sensor_system
      THRESHOLDS_FILE: /app/data/thresholds.json
      FLASK_DEBUG: "false"
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
